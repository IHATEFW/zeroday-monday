# Ajustes generales. Todo lo sensible (tokens) va en GitHub Secrets, nunca acá.

timezone: America/Santiago
publish_hour: 7          # el workflow corre dos veces (por el horario de verano) y solo publica a esta hora local
publish_minute: 30

brand:
  series: "ZERO-DAY MONDAY"      # aparece en la imagen
  handle: "github.com/IHATEFW"   # firma en la esquina de la imagen

post:
  max_chars: 1300            # LinkedIn corta en ~210 con "ver más": el gancho tiene que vivir ahí
  radar_items: 2             # mini-lista "también en el radar" (0 para desactivar)
  hashtags: 3
  # true: el post no lleva links (LinkedIn les baja el alcance) y termina con "Fuentes en el primer comentario 👇".
  # Comentar por API requiere "Community Management API" (solo empresas aprobadas), así que el workflow
  # abre un issue con las fuentes listas para pegar. false: el link de la fuente va al final del post.
  link_in_first_comment: true

llm:
  model: claude-opus-5-5
  effort: high

# Cuántos candidatos ve el modelo editor para elegir la noticia de la semana.
shortlist_size: 18
