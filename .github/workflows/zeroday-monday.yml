name: Zero-Day Monday

on:
  schedule:
    # GitHub usa UTC y Chile cambia de horario. Disparamos dos veces y el script
    # publica solo en la que cae a las 07:30 en America/Santiago:
    - cron: "30 10 * * 1"  # 07:30 horario de verano (UTC-3)
    - cron: "30 11 * * 1"  # 07:30 horario de invierno (UTC-4)
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run genera el post sin publicarlo; publish lo sube a LinkedIn ahora"
        type: choice
        options: [dry-run, publish, candidates]
        default: dry-run

permissions:
  contents: write
  issues: write

concurrency:
  group: zeroday-monday
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generar y publicar
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_TOKEN_EXPIRES_AT: ${{ vars.LINKEDIN_TOKEN_EXPIRES_AT }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            python -m zdm run --scheduled
          elif [ "$MODE" = "publish" ]; then
            python -m zdm run --force
          elif [ "$MODE" = "candidates" ]; then
            python -m zdm candidates
          else
            python -m zdm run --dry-run
          fi

      - name: Guardar post como artefacto
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: post-${{ github.run_id }}
          path: posts/
          if-no-files-found: ignore

      - name: Commit del historial
        if: github.event_name == 'schedule' || inputs.mode == 'publish'
        run: |
          git config user.name "IHATEFW"
          git config user.email "120272906+IHATEFW@users.noreply.github.com"
          git add data/history.json posts/
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "post: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Pedir que pegue las fuentes como primer comentario
        if: steps.run.outputs.comment_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.run.outputs.comment_file }}
          DAY: ${{ steps.run.outputs.comment_date }}
        run: gh issue create --title "💬 Pegar fuentes del post del $DAY" --body-file "$FILE" --assignee "$GITHUB_REPOSITORY_OWNER"

      - name: Avisar si el token de LinkedIn está por vencer
        if: steps.run.outputs.token_expiring == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ steps.run.outputs.token_days }}
        run: |
          title="El token de LinkedIn vence pronto"
          if ! gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q .; then
            gh issue create --title "$title" --body "Quedan ${DAYS} días. Corre \`python scripts/linkedin_auth.py\` en tu máquina para renovarlo (actualiza los secrets solo)."
          fi
